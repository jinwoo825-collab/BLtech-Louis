<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM · 개인 프로젝트 매니지먼트</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --accent-soft: #21324f;
    --green: #3fb950;
    --amber: #d29922;
    --red: #f85149;
    --shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .logo { color: var(--accent); }
  .spacer { flex: 1; }
  .btn {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 13px; cursor: pointer; font-size: 13px;
    transition: .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }

  .layout { display: flex; min-height: calc(100vh - 55px); }
  aside {
    width: 240px; background: var(--panel); border-right: 1px solid var(--border);
    padding: 16px 12px; flex-shrink: 0;
  }
  .side-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 6px 8px 10px; }
  .proj-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
    transition: .12s;
  }
  .proj-item:hover { background: var(--panel-2); }
  .proj-item.active { background: var(--accent-soft); }
  .proj-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .proj-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-count { font-size: 11px; color: var(--muted); background: var(--panel-2); padding: 1px 7px; border-radius: 10px; }
  .proj-item.active .proj-count { background: rgba(0,0,0,.25); }

  main { flex: 1; padding: 22px 26px; overflow-x: auto; }
  .main-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .main-head h2 { margin: 0; font-size: 21px; }
  .stat-row { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; min-width: 110px;
  }
  .stat .num { font-size: 24px; font-weight: 700; }
  .stat .lbl { font-size: 12px; color: var(--muted); }

  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .col {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; min-height: 200px;
  }
  .col.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .col-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 0 4px; }
  .col-head .name { font-weight: 600; font-size: 13px; }
  .col-head .cnt { font-size: 11px; color: var(--muted); }
  .col-head .bar { width: 10px; height: 10px; border-radius: 3px; }

  .card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 12px; margin-bottom: 9px; cursor: grab; transition: .12s;
    border-left: 3px solid var(--muted);
  }
  .card:hover { border-color: var(--accent); }
  .card.dragging { opacity: .4; }
  .card.prio-high { border-left-color: var(--red); }
  .card.prio-mid { border-left-color: var(--amber); }
  .card.prio-low { border-left-color: var(--green); }
  .card .title { font-weight: 500; margin-bottom: 6px; word-break: break-word; }
  .card .title.done { text-decoration: line-through; color: var(--muted); }
  .card .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .tag { padding: 1px 8px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); }
  .tag.due-over { color: var(--red); border-color: var(--red); }
  .tag.due-soon { color: var(--amber); border-color: var(--amber); }
  .card .actions { display: none; gap: 6px; margin-top: 8px; }
  .card:hover .actions { display: flex; }
  .mini { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); cursor: pointer; }
  .mini:hover { color: var(--text); border-color: var(--accent); }

  .empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 13px; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    width: 460px; max-width: 92vw; padding: 22px; box-shadow: var(--shadow);
  }
  .modal h3 { margin: 0 0 16px; font-size: 17px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 11px; color: var(--text); font-size: 13px;
    font-family: inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 64px; }
  .row2 { display: flex; gap: 12px; }
  .row2 .field { flex: 1; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

  .color-picker { display: flex; gap: 8px; }
  .color-swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .color-swatch.sel { border-color: #fff; }

  .card .notes-txt { font-size: 12px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  @media (max-width: 720px){ .board{ grid-template-columns:1fr; } aside{ width:180px; } }
</style>
</head>
<body>
<header>
  <h1><span class="logo">◆</span> PM 워크스페이스</h1>
  <div class="spacer"></div>
  <button class="btn ghost" onclick="exportData()">내보내기</button>
  <button class="btn ghost" onclick="document.getElementById('importFile').click()">가져오기</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  <button class="btn primary" onclick="openTaskModal()">+ 할 일 추가</button>
</header>

<div class="layout">
  <aside>
    <div class="side-title">프로젝트</div>
    <div id="projectList"></div>
    <button class="btn ghost" style="width:100%;margin-top:10px" onclick="openProjectModal()">+ 프로젝트</button>
  </aside>

  <main>
    <div class="main-head">
      <h2 id="mainTitle">전체</h2>
      <div class="spacer"></div>
      <button class="btn ghost danger" id="delProjBtn" onclick="deleteCurrentProject()" style="display:none">프로젝트 삭제</button>
    </div>

    <div class="stat-row" id="statRow"></div>

    <div class="board">
      <div class="col" data-status="todo" ondragover="onDragOver(event)" ondrop="onDrop(event,'todo')" ondragleave="onDragLeave(event)">
        <div class="col-head"><span class="bar" style="background:var(--muted)"></span><span class="name">할 일</span><span class="cnt" id="cnt-todo"></span></div>
        <div id="col-todo"></div>
      </div>
      <div class="col" data-status="doing" ondragover="onDragOver(event)" ondrop="onDrop(event,'doing')" ondragleave="onDragLeave(event)">
        <div class="col-head"><span class="bar" style="background:var(--accent)"></span><span class="name">진행 중</span><span class="cnt" id="cnt-doing"></span></div>
        <div id="col-doing"></div>
      </div>
      <div class="col" data-status="done" ondragover="onDragOver(event)" ondrop="onDrop(event,'done')" ondragleave="onDragLeave(event)">
        <div class="col-head"><span class="bar" style="background:var(--green)"></span><span class="name">완료</span><span class="cnt" id="cnt-done"></span></div>
        <div id="col-done"></div>
      </div>
    </div>
  </main>
</div>

<!-- Task modal -->
<div class="overlay" id="taskOverlay">
  <div class="modal">
    <h3 id="taskModalTitle">할 일 추가</h3>
    <input type="hidden" id="taskId">
    <div class="field">
      <label>제목</label>
      <input type="text" id="taskTitle" placeholder="무엇을 해야 하나요?">
    </div>
    <div class="row2">
      <div class="field">
        <label>프로젝트</label>
        <select id="taskProject"></select>
      </div>
      <div class="field">
        <label>우선순위</label>
        <select id="taskPriority">
          <option value="low">낮음</option>
          <option value="mid" selected>보통</option>
          <option value="high">높음</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>상태</label>
        <select id="taskStatus">
          <option value="todo">할 일</option>
          <option value="doing">진행 중</option>
          <option value="done">완료</option>
        </select>
      </div>
      <div class="field">
        <label>마감일</label>
        <input type="date" id="taskDue">
      </div>
    </div>
    <div class="field">
      <label>메모</label>
      <textarea id="taskNotes" placeholder="참고 사항, 링크, 세부 내용..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('taskOverlay')">취소</button>
      <button class="btn primary" onclick="saveTask()">저장</button>
    </div>
  </div>
</div>

<!-- Project modal -->
<div class="overlay" id="projectOverlay">
  <div class="modal">
    <h3>새 프로젝트</h3>
    <div class="field">
      <label>이름</label>
      <input type="text" id="projName" placeholder="프로젝트 이름">
    </div>
    <div class="field">
      <label>색상</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('projectOverlay')">취소</button>
      <button class="btn primary" onclick="saveProject()">추가</button>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'pm_workspace_v1';
const COLORS = ['#4f8cff','#3fb950','#d29922','#f85149','#a371f7','#f778ba','#39c5cf','#db6d28'];
let state = { projects: [], tasks: [], current: 'all' };
let dragId = null;

/* ---------- persistence ---------- */
function load() {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) {
    try { state = JSON.parse(raw); } catch(e){}
  }
  if (!state.projects || state.projects.length === 0) seed();
  if (!state.current) state.current = 'all';
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function seed() {
  const p1 = { id: uid(), name: '업무', color: '#4f8cff' };
  const p2 = { id: uid(), name: '개인', color: '#3fb950' };
  state.projects = [p1, p2];
  state.tasks = [
    { id: uid(), title: '주간 계획 정리', projectId: p1.id, priority: 'high', status: 'todo', due: '', notes: '월요일 아침에 우선순위 검토', created: Date.now() },
    { id: uid(), title: '진행 중인 문서 초안', projectId: p1.id, priority: 'mid', status: 'doing', due: '', notes: '', created: Date.now() },
    { id: uid(), title: '샘플 완료 항목', projectId: p2.id, priority: 'low', status: 'done', due: '', notes: '드래그로 카드를 옮겨보세요', created: Date.now() },
  ];
  state.current = 'all';
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

/* ---------- rendering ---------- */
function render() {
  renderProjects();
  renderBoard();
  renderStats();
  save();
}

function renderProjects() {
  const list = document.getElementById('projectList');
  const all = `
    <div class="proj-item ${state.current==='all'?'active':''}" onclick="selectProject('all')">
      <span class="proj-dot" style="background:linear-gradient(45deg,#4f8cff,#a371f7)"></span>
      <span class="proj-name">전체</span>
      <span class="proj-count">${state.tasks.length}</span>
    </div>`;
  const items = state.projects.map(p => {
    const c = state.tasks.filter(t => t.projectId === p.id).length;
    return `<div class="proj-item ${state.current===p.id?'active':''}" onclick="selectProject('${p.id}')">
      <span class="proj-dot" style="background:${p.color}"></span>
      <span class="proj-name">${esc(p.name)}</span>
      <span class="proj-count">${c}</span>
    </div>`;
  }).join('');
  list.innerHTML = all + items;
}

function currentTasks() {
  if (state.current === 'all') return state.tasks;
  return state.tasks.filter(t => t.projectId === state.current);
}

function renderBoard() {
  const proj = state.projects.find(p => p.id === state.current);
  document.getElementById('mainTitle').textContent = proj ? proj.name : '전체';
  document.getElementById('delProjBtn').style.display = proj ? 'inline-block' : 'none';

  const tasks = currentTasks();
  ['todo','doing','done'].forEach(status => {
    const items = tasks.filter(t => t.status === status)
      .sort((a,b)=> prioVal(b.priority)-prioVal(a.priority));
    document.getElementById('cnt-'+status).textContent = items.length;
    const col = document.getElementById('col-'+status);
    if (items.length === 0) { col.innerHTML = '<div class="empty">비어 있음</div>'; return; }
    col.innerHTML = items.map(cardHTML).join('');
  });
}

function cardHTML(t) {
  const proj = state.projects.find(p => p.id === t.projectId);
  const projTag = proj ? `<span class="tag" style="border-color:${proj.color};color:${proj.color}">${esc(proj.name)}</span>` : '';
  const dueTag = t.due ? `<span class="tag ${dueClass(t.due)}">📅 ${t.due}</span>` : '';
  const notes = t.notes ? `<div class="notes-txt">${esc(t.notes)}</div>` : '';
  return `<div class="card prio-${t.priority}" draggable="true" data-id="${t.id}"
      ondragstart="onDragStart(event,'${t.id}')" ondragend="onDragEnd(event)">
    <div class="title ${t.status==='done'?'done':''}">${esc(t.title)}</div>
    <div class="meta">${projTag}${dueTag}${prioLabel(t.priority)}</div>
    ${notes}
    <div class="actions">
      <span class="mini" onclick="editTask('${t.id}')">편집</span>
      <span class="mini" onclick="cycleStatus('${t.id}')">상태 →</span>
      <span class="mini" onclick="deleteTask('${t.id}')">삭제</span>
    </div>
  </div>`;
}

function renderStats() {
  const tasks = currentTasks();
  const done = tasks.filter(t=>t.status==='done').length;
  const doing = tasks.filter(t=>t.status==='doing').length;
  const todo = tasks.filter(t=>t.status==='todo').length;
  const overdue = tasks.filter(t=> t.due && t.status!=='done' && t.due < today()).length;
  const pct = tasks.length ? Math.round(done/tasks.length*100) : 0;
  document.getElementById('statRow').innerHTML = `
    <div class="stat"><div class="num">${tasks.length}</div><div class="lbl">전체</div></div>
    <div class="stat"><div class="num" style="color:var(--muted)">${todo}</div><div class="lbl">할 일</div></div>
    <div class="stat"><div class="num" style="color:var(--accent)">${doing}</div><div class="lbl">진행 중</div></div>
    <div class="stat"><div class="num" style="color:var(--green)">${done}</div><div class="lbl">완료 (${pct}%)</div></div>
    <div class="stat"><div class="num" style="color:var(--red)">${overdue}</div><div class="lbl">기한 초과</div></div>`;
}

/* ---------- helpers ---------- */
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function prioVal(p){ return {high:3,mid:2,low:1}[p]||0; }
function prioLabel(p){ const m={high:'🔴 높음',mid:'🟡 보통',low:'🟢 낮음'}; return `<span class="tag">${m[p]}</span>`; }
function today(){ return new Date().toISOString().slice(0,10); }
function dueClass(d){ if(d<today())return 'due-over'; const diff=(new Date(d)-new Date(today()))/86400000; return diff<=2?'due-soon':''; }

/* ---------- actions ---------- */
function selectProject(id){ state.current = id; render(); }

function openTaskModal(){
  document.getElementById('taskModalTitle').textContent = '할 일 추가';
  document.getElementById('taskId').value = '';
  document.getElementById('taskTitle').value = '';
  document.getElementById('taskPriority').value = 'mid';
  document.getElementById('taskStatus').value = 'todo';
  document.getElementById('taskDue').value = '';
  document.getElementById('taskNotes').value = '';
  fillProjectSelect();
  document.getElementById('taskProject').value = state.current !== 'all' ? state.current : (state.projects[0]?.id || '');
  showModal('taskOverlay');
  setTimeout(()=>document.getElementById('taskTitle').focus(),50);
}

function editTask(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  document.getElementById('taskModalTitle').textContent = '할 일 편집';
  document.getElementById('taskId').value = t.id;
  document.getElementById('taskTitle').value = t.title;
  fillProjectSelect();
  document.getElementById('taskProject').value = t.projectId;
  document.getElementById('taskPriority').value = t.priority;
  document.getElementById('taskStatus').value = t.status;
  document.getElementById('taskDue').value = t.due || '';
  document.getElementById('taskNotes').value = t.notes || '';
  showModal('taskOverlay');
}

function saveTask(){
  const title = document.getElementById('taskTitle').value.trim();
  if(!title){ alert('제목을 입력하세요'); return; }
  const id = document.getElementById('taskId').value;
  const data = {
    title,
    projectId: document.getElementById('taskProject').value,
    priority: document.getElementById('taskPriority').value,
    status: document.getElementById('taskStatus').value,
    due: document.getElementById('taskDue').value,
    notes: document.getElementById('taskNotes').value.trim(),
  };
  if(id){
    const t = state.tasks.find(x=>x.id===id);
    Object.assign(t, data);
  } else {
    state.tasks.push({ id: uid(), created: Date.now(), ...data });
  }
  closeModal('taskOverlay');
  render();
}

function deleteTask(id){
  if(!confirm('이 할 일을 삭제할까요?')) return;
  state.tasks = state.tasks.filter(t=>t.id!==id);
  render();
}

function cycleStatus(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  const order = ['todo','doing','done'];
  t.status = order[(order.indexOf(t.status)+1)%3];
  render();
}

function fillProjectSelect(){
  const sel = document.getElementById('taskProject');
  sel.innerHTML = state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
}

/* project modal */
let pickedColor = COLORS[0];
function openProjectModal(){
  document.getElementById('projName').value = '';
  pickedColor = COLORS[0];
  const cp = document.getElementById('colorPicker');
  cp.innerHTML = COLORS.map((c,i)=>`<span class="color-swatch ${i===0?'sel':''}" style="background:${c}" onclick="pickColor('${c}',this)"></span>`).join('');
  showModal('projectOverlay');
  setTimeout(()=>document.getElementById('projName').focus(),50);
}
function pickColor(c,el){
  pickedColor = c;
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
}
function saveProject(){
  const name = document.getElementById('projName').value.trim();
  if(!name){ alert('이름을 입력하세요'); return; }
  const p = { id: uid(), name, color: pickedColor };
  state.projects.push(p);
  state.current = p.id;
  closeModal('projectOverlay');
  render();
}
function deleteCurrentProject(){
  const p = state.projects.find(x=>x.id===state.current); if(!p) return;
  const cnt = state.tasks.filter(t=>t.projectId===p.id).length;
  if(!confirm(`'${p.name}' 프로젝트와 포함된 할 일 ${cnt}개를 삭제할까요?`)) return;
  state.tasks = state.tasks.filter(t=>t.projectId!==p.id);
  state.projects = state.projects.filter(x=>x.id!==p.id);
  state.current = 'all';
  render();
}

/* ---------- drag & drop ---------- */
function onDragStart(e,id){ dragId=id; e.target.classList.add('dragging'); }
function onDragEnd(e){ e.target.classList.remove('dragging'); }
function onDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
function onDrop(e,status){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const t = state.tasks.find(x=>x.id===dragId);
  if(t){ t.status = status; render(); }
  dragId = null;
}

/* ---------- modal utils ---------- */
function showModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('show'); }));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show')); });

/* ---------- import / export ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pm-backup-' + today() + '.json';
  a.click();
}
function importData(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if(data.projects && data.tasks){ state = data; if(!state.current) state.current='all'; render(); alert('가져오기 완료'); }
      else alert('올바른 백업 파일이 아닙니다');
    } catch(e){ alert('파일을 읽을 수 없습니다'); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

/* ---------- init ---------- */
load();
render();
